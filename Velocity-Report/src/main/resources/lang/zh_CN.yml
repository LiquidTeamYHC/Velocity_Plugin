# ============================================================
# VelocityReport — 中文语言文件 (zh_CN)
# ============================================================
# 格式: key: "MiniMessage 格式的消息文本"
# 占位符: {reporter}, {reported}, {id}, {server},
#         {reported_server}, {reason}, {time}, {status},
#         {page}, {total}, {count}, {handler_info}, {player},
#         {target}, {input}, {handler}, {resolution}, {handled_at},
#         {number}, {description}, {icon}, {name}, {hours}
# ============================================================

# ── 通用 ────────────────────────────────────────────────────
prefix: "<red>[举报]</red> "

# ── 举报相关 ────────────────────────────────────────────────
report-sent: "<green>你对 <yellow>{reported}</yellow> 的举报已提交，感谢反馈。</green>"
report-cooldown: "<red>请等待 {time} 秒后再提交举报。</red>"
self-report: "<red>你不能举报自己。</red>"
player-not-found: "<red>玩家 '{player}' 未找到。</red>"
report-offline-too-long: "<red>玩家 <white>{player}</white> 已离线超过 {hours} 小时，无法举报。</red>"
report-offline-disabled: "<red>玩家 <white>{player}</white> 当前不在线，且本服未开启离线举报。</red>"

# ── 列表与详情 ──────────────────────────────────────────────
no-reports: "<yellow>当前没有待处理的举报。</yellow>"
report-list-header: "<gold>=== 举报列表 (第 {page}/{total} 页) ===</gold>"
report-entry: "<yellow>#{id}</yellow> <white>{reported}</white> <gray>被</gray> <white>{reporter}</white> <gray>在</gray> <white>{server}</white> <gray>({time})</gray>"
report-detail: |
  <gold>=== 举报详情 #{id} ===</gold>
  <newline><gray>举报人:</gray> <white>{reporter}</white>
  <newline><gray>被举报人:</gray> <white>{reported}</white>
  <newline><gray>举报人所在服务器:</gray> <white>{server}</white>
  <newline><gray>被举报人所在服务器:</gray> <white>{reported_server}</white>
  <newline><gray>举报原因:</gray> <white>{reason}</white>
  <newline><gray>举报时间:</gray> <white>{time}</white>
  <newline><gray>状态:</gray> <white>{status}</white>{handler_info}

report-closed: "<green>举报 #{id} 已{status}。</green>"

# ── 管理通知 ────────────────────────────────────────────────
staff-notify: "<red>[举报]</red> <white>{reporter}</white> <gray>举报了</gray> <white>{reported}</white> <gray>在</gray> <white>{server}</white><gray>:</gray> <white>{reason}</white>"
staff-join-notify: "<yellow>当前有 {count} 条待处理举报。使用 <click:suggest_command:'/reports'><hover:show_text:'<green>点击查看</green>'><aqua>/reports</aqua></hover></click> 查看。</yellow>"

# ── 错误 ────────────────────────────────────────────────────
invalid-report-id: "<red>未找到举报 #{id}。</red>"
already-closed: "<red>举报 #{id} 已经被{status}了。</red>"
report-internal-error: "<red>发生内部错误，请稍后重试。</red>"
report-internal-error-short: "<red>发生内部错误。</red>"
report-failed-update: "<red>更新举报失败。</red>"

# ── 状态 ────────────────────────────────────────────────────
status-open: "<green>Open</green>"
status-resolved: "<gold>Resolved</gold>"
status-dismissed: "<gray>Dismissed</gray>"
status-open-plain: "未处理"
status-resolved-plain: "已处理"

# ── 命令 ────────────────────────────────────────────────────
command-player-only: "<red>此命令只能由玩家使用。</red>"
command-report-usage: "<gold>用法: /report <玩家> [原因]</gold>"
command-report-custom-reason: "<gold>请使用 /report {player} <自定义原因> 来输入具体原因。</gold>"
command-reason-too-long: "<red>原因过长，请保持在256字以内。</red>"
command-invalid-page: "<red>无效的页码: {input}</red>"
command-reportview-usage: "<gold>用法: /reportview <id></gold>"
command-reportclose-usage: "<gold>用法: /reportclose <id> [处理说明]</gold>"
command-reportclose-default-resolution: "未指定处理说明"
command-reportcd-view-usage: "<gold>用法: /reportcd view <举报编号></gold>"
command-reportcd-resolve-usage: "<gold>用法: /reportcd resolve <举报编号></gold>"
command-reportcd-reopen-usage: "<gold>用法: /reportcd reopen <举报编号></gold>"
command-invalid-id: "<red>无效的举报编号: {input}</red>"
command-reload-success: "<green>配置已重载。</green>"
command-reload-fail: "<red>配置重载失败，请查看控制台日志。</red>"

# ── 管理员名单命令 /reportstaff ─────────────────────────────
command-staff-usage: "<gold>用法: /reportstaff <add|remove|list> [玩家]</gold>"
staff-list-header: "<gold>管理员名单（共 {count} 人）</gold>"
staff-list-config: "<gray>config.yml:</gray> <white>{names}</white>"
staff-list-added: "<gray>staff-users.yml:</gray> <white>{names}</white>"
staff-list-empty-entry: "（空）"
staff-list-hint: "<gray>用 <yellow>/reportstaff add <玩家></yellow> 添加、<yellow>/reportstaff remove <玩家></yellow> 移除。</gray>"
staff-add-success: "<green>已把 <white>{player}</white> 加入管理员名单，现在共 {count} 人。</green>"
staff-add-already: "<yellow><white>{player}</white> 已经在管理员名单里了。</yellow>"
staff-save-failed: "<red>写入 staff-users.yml 失败，请查看控制台日志。</red>"
staff-remove-success: "<green>已把 <white>{player}</white> 移出管理员名单。</green>"
staff-remove-from-config: "<yellow><white>{player}</white> 定义在 config.yml 的 staff-users 里，请到那里删除。</yellow>"
staff-remove-not-found: "<yellow>管理员名单里没有 <white>{player}</white>。</yellow>"

# ── 管理总命令 /reportadmin ─────────────────────────────────
command-reportadmin-help: |
  <gold>===== /reportadmin 管理命令 =====</gold>
  <newline><yellow>/reportadmin reload</yellow> <gray>— 重载配置与语言文件</gray>
  <newline><yellow>/reportadmin list [页码]</yellow> <gray>— 待处理举报列表</gray>
  <newline><yellow>/reportadmin view <编号></yellow> <gray>— 查看举报详情</gray>
  <newline><yellow>/reportadmin close <编号> [处理说明]</yellow> <gray>— 关闭举报</gray>
  <newline><yellow>/reportadmin resolve|reopen <编号></yellow> <gray>— 标记已处理 / 未处理</gray>
  <newline><yellow>/reportadmin history [页码] [玩家]</yellow> <gray>— 全部举报历史</gray>
  <newline><yellow>/reportadmin staff add|remove|list [玩家]</yellow> <gray>— 管理员名单</gray>
  <newline><gray>上面这些命令也可以按老名字单独使用（/reports、/reportview、/reportstaff…）；重载只有这一个入口。</gray>
command-reportadmin-usage-id: "<gold>用法: /reportadmin <view|close|resolve|reopen> <编号> [处理说明]</gold>"
command-reportadmin-unknown: "<red>未知子命令: {input}，输入 /reportadmin 查看帮助。</red>"

# ── 举报历史 ────────────────────────────────────────────────
report-history-player-not-found: "<yellow>未找到 <white>{player}</white> 相关的举报记录。</yellow>"
report-history-title-all: "<gold>全部举报记录 (第 {page}/{total} 页)</gold>"
report-history-title-player: "<gold>{player} 的举报记录 (第 {page}/{total} 页)</gold>"
report-history-status-icon-open: "&c[未处理]"
report-history-status-icon-closed: "&a[已处理]"
report-history-entry-format: "{status_icon} {reporter} &7→ {reported} &7| &f{reason}"
report-history-nav-prev: "<click:run_command:'{command}'><hover:show_text:'{hover}'><gold>[上一页]</gold></hover></click>"
report-history-nav-next: "<click:run_command:'{command}'><hover:show_text:'{hover}'><gold>[下一页]</gold></hover></click>"
report-history-nav-page: "<gray>第 {page}/{total} 页</gray>"
report-history-hover-prev: "<gray>上一页</gray>"
report-history-hover-next: "<gray>下一页</gray>"
report-history-hover-template: |
  <green>点击查看详情</green>
  <newline><gray>{reporter} 举报 {reported}
  <newline>原因: {reason}
  <newline>状态: {status}</gray>
report-history-hover-detail: "<green>点击查看详情</green>"

# ── 举报详情菜单 ────────────────────────────────────────────
report-detail-title: "&6═══ 举报 #{id} 详情 ═══"
report-detail-reporter: "&7举报人: &f{reporter}"
report-detail-reported: "&7被举报人: &f{reported}"
report-detail-reason: "&7原因: &f{reason}"
report-detail-reporter-server: "&7举报人所在服务器: &f{server}"
report-detail-reported-server: "&7被举报人所在服务器: &f{server}"
report-detail-time: "&7时间: &f{time}"
report-detail-status: "&7状态: {status}"
report-detail-handler: "&7处理人: &f{handler}"
report-detail-resolution-label: "&7处理说明: &f{resolution}"
report-detail-handled-at: "&7处理时间: &f{handled_at}"
report-detail-btn-resolve: "<click:run_command:'/reportcd resolve {id}'><hover:show_text:'{hover}'><green>[✅ 标记已处理]</green></hover></click>"
report-detail-btn-reopen: "<click:run_command:'/reportcd reopen {id}'><hover:show_text:'{hover}'><yellow>[↩ 标记未处理]</yellow></hover></click>"
report-detail-btn-back: "<click:run_command:'/reportcd list 1'><hover:show_text:'{hover}'><gray>[返回列表]</gray></hover></click>"
report-detail-hover-resolve: "<green>标记为已处理</green>"
report-detail-hover-reopen: "<yellow>标记为未处理</yellow>"
report-detail-hover-back: "<gray>返回列表</gray>"

# ── 举报原因文本 ────────────────────────────────────────────
reason-hacking: "&c外挂作弊"
reason-hacking-desc: "KillAura, ESP, AutoClicker 等作弊行为"
reason-chat: "&e违规言论"
reason-chat-desc: "骂人、刷屏、违规广告等"
reason-griefing: "&6熊孩子"
reason-griefing-desc: "破坏建筑、偷东西等"
reason-admin-abuse: "&5管理员神权"
reason-admin-abuse-desc: "管理员滥用权限"
reason-other: "&7其他"
reason-other-desc: "使用 /report <玩家> <原因> 自定义"

# ── 举报原因菜单 ────────────────────────────────────────────
report-reason-menu-title: "<gold>═══ 请选择举报 <yellow>{target}</yellow> 的原因 ═══</gold>"
report-reason-menu-hover: "<green>点击选择: {name}</green><newline><gray>{description}</gray>"
report-reason-menu-hover-other: "<gray>{description}</gray>"
report-reason-menu-footer: "<gray>点击上方的选项提交举报，或使用 <yellow>/report {target} <原因></yellow> 自定义原因。</gray>"
report-reason-menu-number-format: "<gray>{number}.</gray> <white>{icon} {name}</white>"
report-reason-menu-option-format: "{icon} {name}"

# ── 处理通知 ────────────────────────────────────────────────
report-toggle-resolved: "<green>举报 #{id} 已标记为已处理。</green>"
report-toggle-reopened: "<yellow>举报 #{id} 已重新标记为未处理。</yellow>"
report-toggle-already-open: "<yellow>举报 #{id} 已经是未处理状态。</yellow>"
report-notify-resolved: "<green>你的举报 #{id} 已标记为已处理。</green>"
report-resolve-default-reason: "管理员标记已处理"
